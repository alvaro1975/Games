<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dibujo con las manos</title>
<style>
  :root { --bg:#14141a; --panel:rgba(30,30,40,.78); --accent:#4cc9f0; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,sans-serif; color:#fff; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:.28; }
  canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .bar { position:fixed; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px;
         padding:12px; background:var(--panel); border-radius:22px; backdrop-filter:blur(6px); z-index:5; }
  #left { left:10px; } #right { right:10px; }
  .bar button { width:84px; height:84px; border-radius:18px; border:3px solid transparent; background:#2a2a38;
                color:#fff; font-size:34px; line-height:1; cursor:pointer; display:flex; flex-direction:column;
                align-items:center; justify-content:center; gap:4px; transition:transform .12s, background .12s; }
  .bar button small { font-size:12px; opacity:.8; }
  .bar button.hover { background:#3b3b52; border-color:var(--accent); transform:scale(1.08); }
  .bar button.active { border-color:#fff; }
  .bar button.flash { background:var(--accent); }
  .bar button.swatch { height:56px; }
  .bar button.swatch span { width:34px; height:34px; border-radius:50%; border:2px solid #fff; display:block; }
  #status { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:5; padding:8px 16px;
            background:var(--panel); border-radius:14px; font-size:14px; text-align:center; max-width:80vw; }
  #start { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; }
  #start h1 { margin:0; font-size:2.2rem; }
  #start p { max-width:560px; opacity:.85; line-height:1.5; margin:0; }
  #startBtn { font-size:1.2rem; padding:14px 34px; border-radius:14px; border:0; background:var(--accent); color:#001; font-weight:700; cursor:pointer; }
  #startBtn:disabled { opacity:.5; cursor:wait; }
  @media (max-height:700px) { .bar button { width:64px; height:64px; font-size:26px; } .bar button.swatch { height:44px; } .bar { gap:8px; } }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="draw"></canvas>
<canvas id="overlay"></canvas>

<div id="left" class="bar">
  <button data-act="pen" class="active">✏️<small>Lápiz</small></button>
  <button data-act="eraser">🧽<small>Goma</small></button>
  <button data-act="undo">↩️<small>Deshacer</small></button>
  <button data-act="clear">🗑️<small>Borrar todo</small></button>
</div>

<div id="right" class="bar">
  <button class="swatch active" data-color="#ffffff"><span style="background:#fff"></span></button>
  <button class="swatch" data-color="#ff4d6d"><span style="background:#ff4d6d"></span></button>
  <button class="swatch" data-color="#ffd166"><span style="background:#ffd166"></span></button>
  <button class="swatch" data-color="#06d6a0"><span style="background:#06d6a0"></span></button>
  <button class="swatch" data-color="#4cc9f0"><span style="background:#4cc9f0"></span></button>
  <button data-act="bigger">➕<small>Más grueso</small></button>
  <button data-act="smaller">➖<small>Más fino</small></button>
  <button data-act="save">💾<small>Guardar</small></button>
</div>

<div id="status">Cargando…</div>

<div id="start">
  <h1>✋ Dibujo con las manos</h1>
  <p>Mueve la mano delante de la cámara: el cursor sigue el punto entre tu pulgar y tu índice.
     <b>Junta el pulgar y el índice (pellizco)</b> para dibujar o para pulsar un icono de los bordes.
     Abre los dedos para mover sin dibujar.</p>
  <button id="startBtn">Activar cámara</button>
  <p id="startMsg" style="font-size:.9rem"></p>
</div>

<script type="module">
// ---------- Configuración ----------
const VISION_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL_URL  = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const PINCH_ON  = 0.28;   // distancia pulgar-índice / tamaño de la mano para empezar a pellizcar
const PINCH_OFF = 0.45;   // para soltar (histéresis)
const ZONE = { x0:0.08, x1:0.92, y0:0.05, y1:0.85 }; // parte de la imagen de cámara que se mapea a toda la pantalla
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                     [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// ---------- Elementos ----------
const $ = s => document.querySelector(s);
const video = $("#video"), drawC = $("#draw"), ovC = $("#overlay");
const dctx = drawC.getContext("2d"), octx = ovC.getContext("2d");
const statusEl = $("#status");
let W = 0, H = 0;
function resize() {
  W = drawC.width = ovC.width = innerWidth;
  H = drawC.height = ovC.height = innerHeight;
  redrawAll();
}

// ---------- Estado del dibujo ----------
const state = { tool:"pen", color:"#ffffff", size:6 };
const strokes = [];

function mid(a, b) { return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
function setStyle(s) {
  dctx.lineCap = dctx.lineJoin = "round";
  dctx.lineWidth = s.tool === "eraser" ? s.size * 4 : s.size;
  dctx.strokeStyle = s.color;
  dctx.fillStyle = s.color;
  dctx.globalCompositeOperation = s.tool === "eraser" ? "destination-out" : "source-over";
}
function drawLastSegment(s) {
  const p = s.points, n = p.length;
  setStyle(s);
  if (n === 1) {
    dctx.beginPath(); dctx.arc(p[0].x, p[0].y, dctx.lineWidth/2, 0, Math.PI*2); dctx.fill();
  } else if (n === 2) {
    dctx.beginPath(); dctx.moveTo(p[0].x, p[0].y); dctx.lineTo(mid(p[0],p[1]).x, mid(p[0],p[1]).y); dctx.stroke();
  } else {
    const a = mid(p[n-3], p[n-2]), b = mid(p[n-2], p[n-1]);
    dctx.beginPath(); dctx.moveTo(a.x, a.y); dctx.quadraticCurveTo(p[n-2].x, p[n-2].y, b.x, b.y); dctx.stroke();
  }
  dctx.globalCompositeOperation = "source-over";
}
function redrawAll() {
  dctx.clearRect(0, 0, W, H);
  for (const s of strokes) {
    const tmp = { ...s, points: [] };
    for (const pt of s.points) { tmp.points.push(pt); drawLastSegment(tmp); }
  }
}

// ---------- Acciones de los iconos ----------
function setActive(group, el) { group.forEach(b => b.classList.remove("active")); el.classList.add("active"); }
const toolBtns = [...document.querySelectorAll('[data-act="pen"],[data-act="eraser"]')];
const swatches = [...document.querySelectorAll("[data-color]")];

function doAction(btn) {
  const act = btn.dataset.act;
  if (btn.dataset.color) {
    state.color = btn.dataset.color; setActive(swatches, btn);
    state.tool = "pen"; setActive(toolBtns, toolBtns[0]);
  } else if (act === "pen" || act === "eraser") {
    state.tool = act; setActive(toolBtns, btn);
  } else if (act === "undo") { strokes.pop(); redrawAll(); }
  else if (act === "clear") { strokes.length = 0; redrawAll(); }
  else if (act === "bigger") state.size = Math.min(40, state.size + 3);
  else if (act === "smaller") state.size = Math.max(2, state.size - 3);
  else if (act === "save") save();
  btn.classList.add("flash"); setTimeout(() => btn.classList.remove("flash"), 180);
  showStatus(`Herramienta: ${state.tool === "pen" ? "lápiz" : "goma"} · grosor ${state.size}`);
}
document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => doAction(b)));

function save() {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = "#14141a"; x.fillRect(0, 0, W, H); x.drawImage(drawC, 0, 0);
  const a = document.createElement("a"); a.download = "dibujo.png"; a.href = c.toDataURL("image/png"); a.click();
}
let statusTimer;
function showStatus(t, persist) { statusEl.textContent = t; clearTimeout(statusTimer); if (!persist) statusTimer = setTimeout(() => statusEl.textContent = "Pellizca para dibujar · abre la mano para mover", 2500); }

// ---------- Filtro One Euro (suavizado sin mucho retardo) ----------
class OneEuro {
  constructor(minCutoff = 1.0, beta = 0.015, dCutoff = 1.0) { Object.assign(this, { minCutoff, beta, dCutoff, x:null, dx:0, t:null }); }
  static alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.x === null) { this.x = v; this.t = t; return v; }
    const dt = Math.max((t - this.t) / 1000, 1/120); this.t = t;
    const dv = (v - this.x) / dt;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * (dv - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (v - this.x);
    return this.x;
  }
}

// ---------- Manos ----------
const hands = {}; // clave: "Left"/"Right"
function newHand() { return { fx:new OneEuro(), fy:new OneEuro(), x:0, y:0, pinch:false, pinchFrames:0, mode:null, stroke:null, hoverBtn:null }; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp01 = v => Math.min(1, Math.max(0, v));

function buttonAt(x, y) {
  for (const b of document.querySelectorAll(".bar button")) {
    const r = b.getBoundingClientRect(), m = 6; // margen para facilitar la puntería
    if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) return b;
  }
  return null;
}
function endStroke(h) {
  if (h.stroke) { if (h.stroke.points.length) strokes.push(h.stroke); h.stroke = null; }
  h.mode = null;
}

function processHand(key, lm, t) {
  const h = hands[key] || (hands[key] = newHand());
  h.seen = true;
  h.lm = lm;
  const toScreen = p => ({
    x: clamp01(((1 - p.x) - ZONE.x0) / (ZONE.x1 - ZONE.x0)) * W,
    y: clamp01((p.y - ZONE.y0) / (ZONE.y1 - ZONE.y0)) * H
  });
  // Cursor = punto medio entre pulgar e índice (estable al pellizcar)
  const tip = { x:(lm[4].x + lm[8].x) / 2, y:(lm[4].y + lm[8].y) / 2 };
  const s = toScreen(tip);
  h.x = h.fx.filter(s.x, t); h.y = h.fy.filter(s.y, t);

  const size = dist(lm[0], lm[9]) || 1;
  const ratio = dist(lm[4], lm[8]) / size;
  h.ratio = ratio;
  const wasPinch = h.pinch;
  if (!h.pinch && ratio < PINCH_ON) { h.pinchFrames++; if (h.pinchFrames >= 2) h.pinch = true; }
  else if (!h.pinch) h.pinchFrames = 0;
  else if (h.pinch && ratio > PINCH_OFF) { h.pinch = false; h.pinchFrames = 0; }

  const over = buttonAt(h.x, h.y);
  h.hoverBtn = over;

  if (h.pinch && !wasPinch) {              // inicio del pellizco
    if (over) { h.mode = "ui"; doAction(over); }
    else { h.mode = "draw"; h.stroke = { tool:state.tool, color:state.color, size:state.size, points:[] }; }
  }
  if (h.pinch && h.mode === "draw" && h.stroke) {
    const pts = h.stroke.points, last = pts[pts.length - 1];
    if (!last || Math.hypot(h.x - last.x, h.y - last.y) > 2) { pts.push({ x:h.x, y:h.y }); drawLastSegment(h.stroke); }
  }
  if (!h.pinch && wasPinch) endStroke(h);  // soltar
}

// ---------- Dibujo del overlay ----------
function renderOverlay() {
  octx.clearRect(0, 0, W, H);
  document.querySelectorAll(".bar button.hover").forEach(b => b.classList.remove("hover"));
  for (const key in hands) {
    const h = hands[key];
    if (!h.seen) continue;
    if (h.hoverBtn) h.hoverBtn.classList.add("hover");
    // esqueleto
    const pt = p => ({ x: clamp01(((1 - p.x) - ZONE.x0) / (ZONE.x1 - ZONE.x0)) * W,
                       y: clamp01((p.y - ZONE.y0) / (ZONE.y1 - ZONE.y0)) * H });
    octx.strokeStyle = "rgba(255,255,255,.35)"; octx.lineWidth = 2;
    for (const [a, b] of CONNECTIONS) {
      const p = pt(h.lm[a]), q = pt(h.lm[b]);
      octx.beginPath(); octx.moveTo(p.x, p.y); octx.lineTo(q.x, q.y); octx.stroke();
    }
    // cursor
    const r = h.pinch ? Math.max(6, state.size / 2 + 2) : 16;
    octx.beginPath(); octx.arc(h.x, h.y, state.tool === "eraser" && h.pinch ? state.size * 2 : r, 0, Math.PI * 2);
    octx.lineWidth = 3;
    octx.strokeStyle = h.pinch ? "#ffd166" : "#4cc9f0";
    octx.fillStyle = h.pinch ? (state.tool === "eraser" ? "rgba(255,255,255,.2)" : state.color) : "rgba(76,201,240,.15)";
    octx.fill(); octx.stroke();
  }
}

// ---------- Arranque ----------
async function start() {
  const btn = $("#startBtn"), msg = $("#startMsg");
  btn.disabled = true; msg.textContent = "Cargando el modelo de detección de manos…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:1280, height:720, facingMode:"user" }, audio:false });
    video.srcObject = stream; await video.play();
    const { HandLandmarker, FilesetResolver } = await import(`${VISION_URL}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${VISION_URL}/wasm`);
    let landmarker;
    try {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions:{ modelAssetPath:MODEL_URL, delegate:"GPU" }, runningMode:"VIDEO", numHands:2,
        minHandDetectionConfidence:0.6, minHandPresenceConfidence:0.6, minTrackingConfidence:0.6 });
    } catch (e) {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions:{ modelAssetPath:MODEL_URL, delegate:"CPU" }, runningMode:"VIDEO", numHands:2 });
    }
    $("#start").remove();
    showStatus("Pellizca para dibujar · abre la mano para mover", true);
    loop(landmarker);
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    msg.textContent = "No se pudo iniciar: " + (e.message || e) +
      " (¿permiso de cámara denegado, sin conexión a internet o página sin HTTPS?)";
  }
}

let lastVideoTime = -1;
function loop(landmarker) {
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    const t = performance.now();
    const res = landmarker.detectForVideo(video, t);
    for (const k in hands) hands[k].seen = false;
    (res.landmarks || []).forEach((lm, i) => {
      const key = res.handednesses?.[i]?.[0]?.categoryName || ("H" + i);
      processHand(key, lm, t);
    });
    for (const k in hands) if (!hands[k].seen) { endStroke(hands[k]); delete hands[k]; } // mano perdida
    renderOverlay();
  }
  requestAnimationFrame(() => loop(landmarker));
}

addEventListener("resize", resize);
resize();
$("#startBtn").addEventListener("click", start);
</script>
</body>
</html>
