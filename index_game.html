<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade AR</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1020;--fg:#fff;--ac:#ffcc00}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
canvas{position:fixed;inset:0;width:100%;height:100%}
.s{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.s.on{display:flex}
h1{margin:0;font-size:2rem;color:var(--ac)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 20px;background:var(--ac);color:#111;min-width:220px}
button.g{background:#2b2f55;color:#fff}
#hud{justify-content:flex-start;pointer-events:none;background:none;flex-direction:row;align-items:flex-start;justify-content:space-between;font-weight:700;text-shadow:0 2px 4px #000}
#wheel{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;width:120px;height:120px;border-radius:50%;border:14px solid #222;box-shadow:0 0 0 3px var(--ac);display:none;pointer-events:none}
#wheel:after{content:"";position:absolute;left:50%;top:0;bottom:50%;width:10px;margin-left:-5px;background:#222}
#ped{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;gap:10px}
#ped button{min-width:0;width:84px;height:110px;color:#111}
#gas{background:#2ecc71}#brk{background:#e74c3c}
#back{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);min-width:0;padding:8px 16px;display:none;z-index:5}
#dod{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;gap:8px}
#dod button{min-width:0;width:62px;height:62px;font-size:1.4rem;background:#8e44ad;color:#fff;padding:0}
input{font:inherit;padding:12px;border-radius:10px;border:0;text-align:center;width:220px;box-sizing:border-box}
#onl{display:none;flex-direction:column;gap:8px;align-items:center}
#over,#mk{background:rgba(14,16,32,.92)}
#qr{background:#fff;padding:12px;border-radius:8px}
</style></head><body>
<video id="v" playsinline muted style="display:none"></video>
<canvas id="c"></canvas>
<div id="wheel"></div>
<div id="dod"><button id="dl">⬅</button><button id="db">⬇</button><button id="dr">➡</button></div>
<div id="ped"><button id="brk">FRENO</button><button id="gas">ACELERAR</button></div>

<div class="s on" id="menu"><h1>🎮 Arcade AR</h1><p>Elige un deporte</p>
<button data-g="basket">🏀 Baloncesto</button><button data-g="darts">🎯 Dardos</button>
<button data-g="box">🥊 Boxeo</button><button data-g="drive">🏎️ Conducción</button>
<button class="g" id="bmk">Ver marcador</button></div>

<div class="s" id="scan"><h2>Apunta la cámara al marcador</h2><p id="st">Buscando…</p>
<button id="sim">Simular marcador</button><button class="g" id="bk">Volver</button></div>

<div class="s" id="hud"><div id="h1"></div><div id="h2"></div></div>

<div class="s" id="dm"><h2>🎯 Dardos</h2>
<button id="m0">Práctica (10 dardos)</button><button id="m1">501 en solitario</button><button id="m2">🌐 501 online</button>
<div id="onl"><input id="nick" maxlength="12" placeholder="Tu nombre"><input id="code" maxlength="10" placeholder="Código de sala">

<button class="g" id="dmb">Volver</button></div>
<button id="back">⬅ Salir</button>
<div class="s" id="over"><h1 id="ot"></h1><p id="os"></p><button id="again">Repetir</button><button class="g" id="menub">Cambiar deporte</button></div>

  tgt={x:(cx/v.videoWidth-.5)*6,y:(.5-cy/v.videoHeight)*3-.5,s:Math.max(.5,Math.min(1.5,sz/v.videoWidth*5))};
